---
- name: Setup macOS
  hosts: macbooks
  become: false
  roles:
    - { role: macos, tags: [macos] }
    - { role: homebrew, tags: [homebrew, brew] }
    - { role: java, tags: [java] }

- name: Setup local machine
  hosts: all
  become: false
  roles:
    - { role: dotfiles, tags: [dotfiles] }
    - { role: projects, tags: [projects] }
